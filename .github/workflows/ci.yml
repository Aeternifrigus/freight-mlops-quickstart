name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.2 "ruff>=0.8,<1" "pytest>=8.3,<9"
      - run: ruff check .
      - run: pytest -q
